name: Daily scheme monitor (4:30 PM IST)

on:
  workflow_dispatch:
  schedule:
    # 4:30 PM IST = 11:00 UTC, Mon-Fri
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Discover available Gemini models
        run: python scripts/list_gemini_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Run market ingestion layer
        run: python -m scheme_intel.ingest
        env:
          PYTHONPATH: src
      - name: Run Stage 1 & Stage 2 intelligence pipeline
        run: python -m scheme_intel.main --send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
      - name: Store updated research & ingestion snapshots
        run: |
          git config user.name "scheme-intel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingested.json
          git add -f data/latest.json
          git diff --cached --quiet || git commit -m "chore: update daily ingestion and scheme-monitor snapshots"
          git push

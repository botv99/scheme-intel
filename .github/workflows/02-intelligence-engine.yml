name: 02 Intelligence Engine

on:
  workflow_run:
    workflows: ["01 Ingestion Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intelligence:
    name: Run Core Strategy & Intelligence Engine
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover available LLM models
        run: python scripts/list_gemini_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      - name: Run Stage 1 & Stage 2 Intelligence Engine
        run: python -m scheme_intel.main --send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER || secrets.LLM_PROVIDER_ORDER || '' }}
          PYTHONPATH: src
      - name: Store updated intelligence & performance snapshots
        run: |
          git config user.name "scheme-intel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/latest.json
          git add -f data/performance/latest.json data/performance/latest.md
          git checkout -- . || true
          git diff --cached --quiet || (git commit -m "chore(intelligence): update trade setups and performance reports [skip ci]" && git push)

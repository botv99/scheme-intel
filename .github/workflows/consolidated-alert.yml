name: "GOBARdhan Consolidated Alert (4:30 PM IST)"

on:
  workflow_dispatch:
  schedule:
    # 4:30 PM IST = 11:00 UTC, Mon–Fri
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  consolidated-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run consolidated GOBARdhan alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: |
          python -m scheme_intel.consolidated --send

      - name: Store snapshot
        run: |
          git config user.name "scheme-intel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: consolidated alert snapshot"
          git push

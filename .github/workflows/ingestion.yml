name: Daily ingestion (4:30 PM IST)

on:
  workflow_dispatch:
  schedule:
    # 4:30 PM IST = 11:00 UTC, Mon-Fri
    - cron: "0 11 * * 1-5"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run ingestion layer
        run: python -m scheme_intel.ingest
        env:
          PYTHONPATH: src
      - name: Store ingestion snapshot
        run: |
          git config user.name "scheme-intel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ingested.json
          git diff --cached --quiet || git commit -m "chore: update daily ingestion snapshot"
          git push

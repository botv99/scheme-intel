name: Verify Live LLM Providers

on:
  workflow_dispatch:
    inputs:
      provider_order:
        description: "Custom provider order (comma-separated, e.g. 'gemini,groq,openrouter,openai')"
        required: false
        type: string
        default: ""
      gemini_model:
        description: "Gemini model override (leave empty to use repository secret or default)"
        required: false
        type: string
        default: ""
      groq_model:
        description: "Groq model override (leave empty to use repository secret or default)"
        required: false
        type: string
        default: ""
      openrouter_model:
        description: "OpenRouter model override (leave empty to use repository secret or default)"
        required: false
        type: string
        default: ""
      openai_model:
        description: "OpenAI model override (leave empty to use repository secret or default)"
        required: false
        type: string
        default: ""
      discover_models:
        description: "Run model discovery script before live verification"
        required: false
        type: boolean
        default: true

concurrency:
  group: verify-providers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  verify:
    name: Verify Multi-Provider LLMs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover available LLM models
        if: ${{ inputs.discover_models != false }}
        run: python scripts/list_gemini_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model || secrets.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model || secrets.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || secrets.OPENAI_MODEL }}

      - name: Run Live LLM Provider Verification
        run: python scripts/verify_live_providers.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model || secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model || secrets.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model || secrets.OPENROUTER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.openai_model || secrets.OPENAI_MODEL }}
          LLM_PROVIDER_ORDER: ${{ inputs.provider_order || vars.LLM_PROVIDER_ORDER || secrets.LLM_PROVIDER_ORDER || '' }}

name = "scheme-intel-telegram-gateway"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Non-sensitive configuration variables
[vars]
GITHUB_OWNER = "botv99"
GITHUB_REPO = "scheme-intel"
GITHUB_BRANCH = "main"
SNAPSHOT_PATH = "data/intelligence/latest.json"

# SECRETS (Do NOT put in this file! Set via `npx wrangler secret put <NAME>`):
# - TELEGRAM_BOT_TOKEN       : Telegram bot token from @BotFather
# - TELEGRAM_WEBHOOK_SECRET  : Secret token for Telegram X-Telegram-Bot-Api-Secret-Token validation
# - GITHUB_TOKEN             : GitHub Personal Access Token (with repo or Actions:write scope)
# - SUPABASE_URL             : Supabase project URL (e.g. https://xyz.supabase.co)
# - SUPABASE_SERVICE_ROLE_KEY: Supabase service_role secret key for PostgREST access
# - RAZORPAY_KEY_ID          : Razorpay API Key ID
# - RAZORPAY_KEY_SECRET      : Razorpay API Key Secret
# - RAZORPAY_WEBHOOK_SECRET  : Razorpay Webhook secret for HMAC signature verification
#
# Administrative & Access Variables:
# - ADMIN_USER_IDS           : Comma-separated Telegram User IDs with platform admin privileges
# - TELEGRAM_ALLOWED_USER_IDS: Optional legacy emergency fallback whitelist
# - TELEGRAM_ALLOWED_CHAT_IDS: Optional legacy emergency fallback whitelist


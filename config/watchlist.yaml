scheme:
  name: GOBARdhan — National Circular Bioenergy Scheme
  aliases: [GOBARdhan, CBG, Bio-CNG, compressed biogas, compressed biogas, SATAT, biogas]
  official_sources:
    - name: PIB Ministry of Petroleum & Natural Gas
      url: https://www.pib.gov.in/AllRel.aspx?reg=3&lang=1
    - name: GOBARdhan Unified Registration Portal
      url: https://www.gobardhan.sbm.gov.in/
    - name: Ministry of New and Renewable Energy
      url: https://mnre.gov.in/
    - name: Ministry of Jal Shakti
      url: https://jalshakti-ddws.gov.in/
    - name: Central Public Procurement Portal (tenders)
      url: https://eprocure.gov.in/eprocure/app
    - name: NSE corporate filings
      url: https://www.nseindia.com/companies-listing/corporate-filings-announcements?tabIndex=equity
    - name: BSE corporate announcements
      url: https://www.bseindia.com/corporates/ann.html

settings:
  rally_threshold_pct: 10
  rally_window_days: 15
  max_setup_age_days: 5
  risk_per_trade_pct: 1
  minimum_catalyst_score: 60

# Daily market-data ingestion layer.
# Run with: PYTHONPATH=src python -m scheme_intel.ingest
ingestion:
  days_back: 7          # keep exchange deals / announcements from the last N trading days
  screener:
    chart_days: 365     # number of daily closes pulled from screener.in to compute RSI / trend
  exchanges:
    bulk_deals: true
    announcement_keywords: [tender, contract, order, LOA, award, bulk deal, block deal]
  news_sources:
    - name: Mint
      rss: https://www.livemint.com/rss/markets
    - name: Financial Express (markets)
      pages:
        - https://www.financialexpress.com/market/
        - https://www.financialexpress.com/industry/
    - name: Moneycontrol
      rss: https://www.moneycontrol.com/rss/marketreports.xml

stocks:
  - name: TruAlt Bioenergy
    symbol: TRUALT.NS
    screener_id: TRUALT
    aliases: [TruAlt, TruAlt Bioenergy]
    thesis: CBG developer and producer; monitor project commissioning, offtake, and policy support.
  - name: VA Tech Wabag
    symbol: WABAG.NS
    screener_id: WABAG
    aliases: [VA Tech Wabag, Wabag]
    thesis: Water and wastewater solutions; monitor organic-waste, biomethanation, and municipal contract exposure.
  - name: Praj Industries
    symbol: PRAJIND.NS
    screener_id: PRAJIND
    aliases: [Praj Industries, Praj]
    thesis: Bioenergy engineering and CBG technology; monitor orders, plant commissioning, and policy incentives.
  - name: Organic Recycling Systems
    symbol: ORGANICREC.BO
    screener_id: "543997"
    aliases: [Organic Recycling Systems, ORSL, ORS]
    thesis: Organic-waste processing; monitor tenders, municipal contracts, and project awards.
  - name: Kirloskar Pneumatic
    symbol: KIRLPNU.NS
    screener_id: KIRLPNU
    aliases: [Kirloskar Pneumatic, Kirloskar]
    thesis: Compression equipment; monitor CBG plant capex orders and industrial demand.
  - name: GAIL
    symbol: GAIL.NS
    screener_id: GAIL
    aliases: [GAIL, GAIL India]
    thesis: Gas marketing and infrastructure; monitor CBG offtake, blending, and pipeline announcements.
  - name: Indian Oil Corporation
    symbol: IOC.NS
    screener_id: IOC
    aliases: [Indian Oil, IOCL, IOC]
    thesis: CBG offtake and retail network; monitor procurement, blending, and project partnerships.

